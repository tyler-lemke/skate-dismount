<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">STAIR//WRECK crash HUD design concept</title>
  <desc id="description">Diagrammatic interface study with a large insurance payout, compact eleven-region injury silhouette, one crashbreaker token, short receipt, and an open central gameplay area. Not a gameplay screenshot.</desc>
  <defs>
    <linearGradient id="city" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182934"/><stop offset=".55" stop-color="#304854"/><stop offset="1" stop-color="#49606a"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#899995"/><stop offset="1" stop-color="#43565c"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102430" stop-opacity=".98"/><stop offset="1" stop-color="#0b1b26" stop-opacity=".96"/></linearGradient>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".5" fill="#f2efe4" opacity=".1"/><circle cx="6" cy="4" r=".35" fill="#f2efe4" opacity=".08"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#06131b" flood-opacity=".45"/></filter>
    <style>
      .paper{fill:#f5f0e3}.mint{fill:#85edba}.amber{fill:#f4c878}.muted{fill:#a8bac0}.ink{fill:#102430}
      .eyebrow{font-family:Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:2.2px}
      .meta{font-family:Arial,sans-serif;font-size:14px;letter-spacing:.8px}
      .number{font-family:Arial,sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
      .title{font-family:Arial,sans-serif;font-size:20px;font-weight:700;letter-spacing:1px}
    </style>
  </defs>
  <!-- Concept scenery is deliberately diagrammatic, not an assertion about Godot rendering. -->
  <rect width="1440" height="900" fill="url(#city)"/>
  <g opacity=".28" fill="#0b1c27"><path d="M0 250V0h240v310zM218 160V0h146v262zM1108 0h186v303l-186-70zM1284 0h156v390l-156-101z"/></g>
  <g opacity=".4" fill="#b6d5c9"><path d="M56 50h18v24H56zm45 0h18v24h-18zm76 0h18v24h-18zM1139 50h16v24h-16zm37 0h16v24h-16zm68 0h16v24h-16zm65 0h16v24h-16z"/></g>
  <path d="M511 124h402l486 735H55z" fill="url(#road)" opacity=".78"/>
  <g stroke="#ecf0de" stroke-width="10" opacity=".28"><path d="M454 230h522M416 296h594M376 371h680M327 457h777M271 560h890M202 686h1038"/></g>
  <g stroke="#a4ead0" stroke-width="5" opacity=".5"><path d="M500 126L140 870M924 126l382 744"/></g>
  <path d="M538 585h375l187 265H372z" fill="#344c54" opacity=".42"/>
  <g opacity=".85" transform="translate(692 433)"><ellipse cx="7" cy="297" rx="104" ry="19" fill="#122631" opacity=".38"/><path d="M-45 221l82 15 37 22-11 13-112-16z" fill="#142b34" stroke="#91eabc" stroke-width="5"/><circle cx="-23" cy="265" r="12" fill="#182e35"/><circle cx="46" cy="275" r="12" fill="#182e35"/><path d="M-19 110l37-22 29 51-12 42-20-3-26-44z" fill="#78d5ae" stroke="#172e37" stroke-width="5"/><circle cx="-1" cy="69" r="27" fill="#f0bd86"/><path d="M-29 62q2-38 35-35 27 2 28 35z" fill="#ec884f"/><path d="M-5 175l-36 51m63-47 40 48M-18 120l-35 57m77-54 40 44" fill="none" stroke="#152a34" stroke-width="18" stroke-linecap="round"/></g>
  <path d="M913 567q99 29 150 99" fill="none" stroke="#f4c878" stroke-width="4" stroke-dasharray="9 10" opacity=".8"/>
  <g transform="translate(975 636)" opacity=".75"><path d="M0 22q4-22 31-24h59q24 0 29 24l10 33H-9z" fill="#f1c56f" stroke="#162b34" stroke-width="5"/><path d="M28 3h70l9 28H12z" fill="#1d4857"/><circle cx="18" cy="60" r="14" fill="#152a34"/><circle cx="105" cy="60" r="14" fill="#152a34"/><path d="M4 39h24m76 0h18" stroke="#f8e9be" stroke-width="6"/></g>
  <rect width="1440" height="900" fill="url(#grain)"/>
  <rect x="514" y="17" width="412" height="30" rx="15" fill="#102430" opacity=".94"/>
  <text x="720" y="38" text-anchor="middle" class="eyebrow amber" font-size="11">DESIGN CONCEPT  ·  NOT A GAMEPLAY SCREENSHOT</text>

  <!-- Primary live currency. -->
  <g filter="url(#shadow)"><rect x="28" y="64" width="335" height="140" rx="16" fill="url(#card)" stroke="#678283" stroke-width="1.5"/></g>
  <rect x="28" y="64" width="6" height="140" rx="3" fill="#85edba"/>
  <text x="52" y="96" class="eyebrow amber">INSURANCE PAYOUT</text>
  <text x="48" y="158" class="number paper" font-size="54">$48,930</text>
  <text x="52" y="185" class="meta mint">15-HIT CASCADE  ×4</text>

  <!-- Protected center deliberately free of fixed interface. -->
  <g opacity=".42"><path d="M382 112h33m-33 0v31M1057 112h-33m33 0v31M382 701h33m-33 0v-31M1057 701h-33m33 0v-31" fill="none" stroke="#d7f3df" stroke-width="2"/></g>

  <!-- Compact but complete limb map: eleven individual filled regions, numbered legend. -->
  <g filter="url(#shadow)"><rect x="28" y="223" width="250" height="402" rx="15" fill="url(#card)" stroke="#506b72" stroke-width="1.3"/></g>
  <text x="48" y="255" class="eyebrow amber">INJURY CLAIM</text>
  <text x="48" y="279" class="meta muted" font-size="12">11 VERIFIED REGIONS</text>
  <g stroke="#ebeedf" stroke-width="1.2" transform="translate(50 290)">
    <rect x="77" y="0" width="30" height="29" rx="10" fill="#f17753"/><rect x="71" y="32" width="42" height="55" rx="10" fill="#ed966a"/><rect x="77" y="91" width="30" height="27" rx="9" fill="#f0c370"/>
    <rect x="53" y="36" width="14" height="49" rx="7" fill="#f0c370"/><rect x="117" y="36" width="14" height="49" rx="7" fill="#607983"/>
    <rect x="44" y="89" width="13" height="43" rx="6" fill="#f17753"/><rect x="127" y="89" width="13" height="43" rx="6" fill="#f0c370"/>
    <rect x="76" y="122" width="16" height="47" rx="8" fill="#f0c370"/><rect x="93" y="122" width="16" height="47" rx="8" fill="#ed966a"/>
    <rect x="75" y="173" width="16" height="50" rx="8" fill="#f17753"/><rect x="94" y="173" width="16" height="50" rx="8" fill="#f0c370"/>
  </g>
  <text x="49" y="537" class="eyebrow paper" font-size="11">MOST AFFECTED: HEAD</text>
  <text x="49" y="560" class="meta amber">FRACTURED  ·  +$9,800</text>
  <path d="M48 579h209" stroke="#43606c"/>
  <text x="49" y="602" class="meta muted" font-size="12">VIEW ALL 11 IN CLAIM FILE</text>

  <!-- Small supporting telemetry. -->
  <rect x="28" y="766" width="178" height="103" rx="14" fill="url(#card)" stroke="#506b72"/>
  <text x="49" y="797" class="eyebrow muted" font-size="11">GROUND SPEED</text>
  <text x="45" y="847" class="number paper" font-size="42">04</text><text x="113" y="844" class="meta muted">KM/H</text>

  <!-- One contextual receipt on the edge; never over the skater. -->
  <g filter="url(#shadow)"><rect x="1113" y="246" width="296" height="95" rx="14" fill="url(#card)" stroke="#6a7c75"/></g>
  <text x="1133" y="275" class="eyebrow amber" font-size="11">LATEST CLAIM RECEIPT</text>
  <text x="1133" y="304" class="meta paper">LEFT FOREARM  /  STEP</text>
  <text x="1133" y="328" class="meta mint">+$533  ·  VERIFIED IMPACT</text>

  <!-- A single available resource, not a row of pips. -->
  <g filter="url(#shadow)"><rect x="1079" y="716" width="330" height="153" rx="16" fill="url(#card)" stroke="#85edba" stroke-width="1.5"/></g>
  <circle cx="1121" cy="757" r="19" fill="#85edba"/><path d="M1114 758l5 5 10-13" fill="none" stroke="#102430" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1153" y="754" class="eyebrow mint">CRASHBREAKER</text>
  <text x="1153" y="777" class="meta paper">ONE READY</text>
  <path d="M1104 799h280" stroke="#415d64"/>
  <text x="1103" y="827" class="meta amber">SHIFT  ·  AIMED DOWNSTAIRS</text>
  <text x="1103" y="851" class="meta muted">A / D aim  ·  ENTER file claim</text>

  <text x="694" y="853" text-anchor="middle" class="eyebrow paper" font-size="12" opacity=".85">BOTTOM PLAZA  →  MOVING TRAFFIC</text>
</svg>
